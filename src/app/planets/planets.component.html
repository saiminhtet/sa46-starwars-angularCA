<div fxLayoutAlign="center">
  <h2>Planets</h2>
</div>
@if (list) {
  <div fxLayout="row" fxLayoutGap="0.5%" class="btn-page">
    <div>
      <button [disabled]="(list['previous'] == null)" (click)="goPrevious()"  color="primary" mat-raised-button>PREVIOUS</button>&nbsp;
    </div>
    <div>
      <button [disabled]="(list['next'] == null)" (click)="goNext()"  color="primary" mat-raised-button>NEXT</button>
    </div>
  </div>
}
<div class="work" fxLayout="row" fxLayout.xs="column" fxLayoutWrap fxLayoutGap="0.5%" fxLayoutAlign="center">
  @for (planet of planets; track planet) {
    <mat-card fxFlex.xs="100%" fxFlex.sm="30%" fxFlex.xl="17%" fxFlex.lg="17%"  class="card-picture card" >
      <mat-card-title (click)="getPlanetDetails(planet['url'])">{{planet.name}}</mat-card-title>
      <mat-card-subtitle>planet</mat-card-subtitle>
      <img mat-card-image src="{{planet.img_url}}" (click)="getPlanetDetails(planet['url'])">
      <mat-card-actions>
        <button (click)="getPlanetDetails(planet['url'])" mat-button>View</button>
        <button mat-button>SHARE</button>
      </mat-card-actions>
    </mat-card>
  }

</div>
